		<!--
			========================================================================
			SYNCHRONOUS THEME & PREFERS-COLOR-SCHEME INITIALIZER (ZERO-FOUC)
			========================================================================
			Executes prior to first paint to read saved theme preferences from
			localStorage (`engine_room_settings`) and resolve the active color scheme
			against `window.matchMedia('(prefers-color-scheme: dark)')`.
			========================================================================
		-->
		<script>
			(function () {
				try {
					if (window.location && /^\/artists\//i.test(window.location.pathname)) {
						var cleanPath = window.location.pathname.replace(/^\/artists\//i, '/');
						window.location.replace(
							cleanPath + (window.location.search || '') + (window.location.hash || '')
						);
						return;
					}
					var raw = localStorage.getItem('engine_room_settings');
					var parsed = raw ? JSON.parse(raw) : {};
					var theme = parsed.theme || 'studio';
					var colorMode = parsed.colorMode || 'auto';
					var osDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var scheme =
						colorMode === 'light' ? 'light' : colorMode === 'dark' ? 'dark' : osDark ? 'dark' : 'light';
					var root = document.documentElement;
					root.setAttribute('data-theme', theme);
					root.setAttribute('data-color-scheme', scheme);
					root.setAttribute('data-color-mode', colorMode);
					root.style.colorScheme = scheme;
				} catch (e) {}
			})();
		</script>
