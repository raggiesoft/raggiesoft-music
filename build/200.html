	============================================================================
	src/app.html — Master HTML Document Shell for The Listening Room
	============================================================================
	Plain-English Overview (100-Level JavaScript & Web Guide):
	  Every page on `music.raggiesoft.com` starts from this single HTML skeleton.
	  SvelteKit takes this file and fills in two special template slots:
	    1. The head slot inside `<head>`: Replaced with each page's title,
	       meta tags, canonical `rel="canonical"` URL, and CSS/JS bundle imports.
	    2. The body slot inside `<body>`: Replaced with the rendered HTML from
	       `src/routes/+layout.svelte` and the current route's `+page.svelte`.

	  Why is there an inline `<script>` inside `<head>` BEFORE any CSS or body?
	    Browsers execute synchronous `<script>` tags in `<head>` BEFORE painting
	    a single pixel on screen. By reading `localStorage.getItem('engine_room_settings')`
	    and `window.matchMedia('(prefers-color-scheme: dark)')` right here, we set
	    `data-theme` and `data-color-scheme` on `<html>` immediately—preventing a
	    jarring "Flash of Unstyled/Wrong-Theme Content" (FOUC) when someone reloads
	    the page in Light Mode or Sepia Mode!
	============================================================================
-->
<html lang="en" data-theme="studio" data-color-scheme="dark" data-color-mode="auto">

		<!--
			========================================================================
			SYNCHRONOUS THEME, STANDALONE PWA & LEGACY PATH INITIALIZER (ZERO-FOUC)
			========================================================================
			Executes prior to first paint to read saved theme preferences from
			localStorage (`engine_room_settings`), resolve `prefers-color-scheme`,
			and tag standalone PWA display mode. Server-side 301 redirects for
			`/artists/*` are enforced by Nginx and `src/hooks.server.js`; the
			client check remains solely as an offline Service Worker fallback.
			Note: Written as an IIFE `(function () { ... })();` using ES5 `var` so
			variables stay private and never collide with global `window` scope.
			========================================================================
		-->
		<script>
			(function () {
				try {
					// 1. Offline Service Worker fallback redirect for legacy `/artists/*` URLs
					if (window.location && /^\/artists(\/|$)/i.test(window.location.pathname)) {
						var stripped = window.location.pathname.replace(/^\/artists\/?/i, '/');
						var cleanPath = stripped === '/' ? '/discography' : stripped;
						window.location.replace(
							cleanPath + (window.location.search || '') + (window.location.hash || '')
						);
						return;
					}
					// 2. Read saved theme palette & light/dark mode preference from browser localStorage
					var raw = localStorage.getItem('engine_room_settings');
					var parsed = raw ? JSON.parse(raw) : {};
					var theme = parsed.theme || 'studio';
					var colorMode = parsed.colorMode || 'auto';
					// Check if the visitor's OS (macOS, Windows, iOS, Android) prefers Dark Mode
					var osDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var scheme =
						colorMode === 'light'
							? 'light'
							: colorMode === 'dark'
								? 'dark'
								: osDark
									? 'dark'
									: 'light';
					// Stamp resolved attributes onto `<html>` (`document.documentElement`) before first paint
					var root = document.documentElement;
					root.setAttribute('data-theme', theme);
					root.setAttribute('data-color-scheme', scheme);
					root.setAttribute('data-color-mode', colorMode);
					root.style.colorScheme = scheme;

						(document.referrer && document.referrer.indexOf('android-app://') === 0) ||

							).matches);
